<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Baharat Reçeteleme Otomasyonu</title>
    <meta name="description" content="Endüstriyel baharat reçeteleme ve terazi tartım kontrol otomasyon yazılımı.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Libre+Barcode+128&display=swap"
        rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-slate-950 text-white font-sans antialiased">

    <!-- APP CONTAINER -->
    <div id="app-root" class="min-h-screen flex flex-col">

        {% include 'partials/login.html' %}
        {% include 'partials/admin.html' %}
        {% include 'partials/operator.html' %}

    {% include 'partials/modals.html' %}

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Frontend JS Modules -->
    <script src="/static/js/modules/setup.js?v={{ range(1, 100000) | random }}"></script>
    <script src="/static/js/modules/api.js?v={{ range(1, 100000) | random }}"></script>
    <script src="/static/js/modules/routing.js?v={{ range(1, 100000) | random }}"></script>
    <script src="/static/js/modules/admin.js?v={{ range(1, 100000) | random }}"></script>
    <script src="/static/js/modules/operator.js?v={{ range(1, 100000) | random }}"></script>
    <script src="/static/js/modules/events.js?v={{ range(1, 100000) | random }}"></script>
    <script src="/static/js/modules/print.js?v={{ range(1, 100000) | random }}"></script>
</body>

</html>
